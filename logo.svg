<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="aravotix-logo-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="aravotix-logo-title">Aravotix logo</title>
  <defs>
    <!-- Left leg fades out: the past. -->
    <linearGradient id="past" gradientUnits="userSpaceOnUse" x1="32" y1="9" x2="10" y2="55">
      <stop offset="0" stop-color="#a9ccff"/>
      <stop offset="1" stop-color="#3b82ff" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Right leg brightens: the future. -->
    <linearGradient id="future" gradientUnits="userSpaceOnUse" x1="32" y1="9" x2="54" y2="55">
      <stop offset="0" stop-color="#8ff0ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="17" y1="39" x2="47" y2="39">
      <stop offset="0" stop-color="#5b8dff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8ff0ff"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 9 10 55" stroke="url(#past)"/>
    <path d="M32 9 54 55" stroke="url(#future)"/>
    <path d="M17.7 39H46.3" stroke="url(#bar)"/>
  </g>
</svg>
